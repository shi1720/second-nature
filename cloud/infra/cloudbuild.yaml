steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'cloud/Dockerfile.api', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/second-nature/api:latest', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'cloud/Dockerfile.worker', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/second-nature/worker:latest', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/second-nature/api:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/second-nature/worker:latest'
timeout: 1800s
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
substitutions:
  _REGION: us-central1
